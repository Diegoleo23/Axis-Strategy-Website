name: Send RSS campaign

on:
  push:
    branches: [main]
    paths: [feed.xml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no emails sent, no Mailchimp calls made)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send campaigns for new feed items
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_FROM_EMAIL: ${{ secrets.MAILCHIMP_FROM_EMAIL }}
          MAILCHIMP_FROM_NAME: ${{ vars.MAILCHIMP_FROM_NAME }}
        run: node scripts/send-rss-campaign.mjs

      - name: Upload dry-run preview
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: dry-run-output/
          if-no-files-found: ignore

      - name: Commit updated sent-state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .mailchimp-sent.json
          git diff --cached --quiet || git commit -m "Record sent RSS campaign(s) [skip ci]"
          git push
